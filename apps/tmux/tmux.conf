# ============================================================
# tmux.conf  --  prefix is Ctrl-a
# symlinked to ~/.config/tmux/tmux.conf by dotfiles/install.sh
# ============================================================

# --- Terminal / nvim interop ---
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"   # truecolor (catppuccin, etc.)
set -sg escape-time 10                      # snappy ESC for nvim
set -g focus-events on                      # nvim FocusGained/FocusLost
set -g set-clipboard on                     # OSC-52 passthrough to ghostty

# --- Prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"

# --- Indexing ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Mouse / history / copy-mode ---
set -g mouse on
set -g history-limit 10000
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# --- Windows / splits (new pane inherits cwd) ---
bind c new-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# --- Pane navigation (vi) ---
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- Sessions / panes ---
bind s choose-tree -Zs
bind S command-prompt -p "new session:" "new-session -s %%"
bind X confirm-before -p "kill-session: #S? (y/n)" kill-session
bind x kill-pane
bind d detach-client

# --- Alt-arrow window switching (no prefix) ---
bind -n M-Left  previous-window
bind -n M-Right next-window

# --- Look & feel (cyberpunk, matches ghostty) ---
set -g status-interval 5
set -g status-style "bg=#0a0a12,fg=#e6e6ff"
set -g status-left "#[bg=#00f5ff,fg=#0a0a12,bold] #S #[bg=#0a0a12,fg=#00f5ff] "
set -g status-right "#[fg=#ff2b4a]#[fg=#e6e6ff] %H:%M  %d-%b "
setw -g window-status-current-style "bg=#1a1a2e,fg=#00f5ff,bold"
setw -g window-status-style "fg=#6c6c8a"
setw -g window-status-current-format " #I:#W "
setw -g window-status-format " #I:#W "
set -g pane-border-style "fg=#1a1a2e"
set -g pane-active-border-style "fg=#00f5ff"
