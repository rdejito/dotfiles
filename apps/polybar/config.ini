[bar/main]
monitor = ${env:MONITOR}

width = 100%
height = 32

bottom = false
fixed-center = true

background = #0a080a
foreground = #f2e8eb

line-size = 2
line-color = #ff1744

border-size = 0

padding-left = 0
padding-right = 0

module-margin = 0

font-0 = FiraCode Nerd Font Mono:size=10;2

modules-left = i3 sep date sep time sep apps
modules-right = sep network sep bluetooth sep storage sep cpu sep memory sep pulseaudio sep battery sep updates

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/i3]
type = internal/i3

pin-workspaces = true
index-sort = true
wrapping-scroll = false

enable-click = true
enable-scroll = true

label-focused = %name%
label-focused-background = #880808
label-focused-foreground = #FFFFFF
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = #8f737b
label-unfocused-padding = 2

label-visible = %name%
label-visible-background = #100b0e
label-visible-foreground = #f2e8eb
label-visible-padding = 2

label-urgent = %name%
label-urgent-background = #ff335c
label-urgent-foreground = #0a080a
label-urgent-padding = 2

[module/cpu]
type = internal/cpu
interval = 2

format = <label>
format-prefix = "CPU "
format-prefix-foreground = #ff1744

label = %percentage%%

[module/memory]
type = internal/memory
interval = 2

format = <label>
format-prefix = "RAM "
format-prefix-foreground = #ff1744 

label = %percentage_used%%

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>

label-volume = %{F#ff1744}VOL%{F-} %percentage%

label-muted = MUTED
label-muted-foreground = #8f737b

[module/date]
type = custom/script
exec = date '+%a %d %b'
interval = 30
format = <label>
label = %output%
label-foreground = #00FFFF
click-left = ~/.config/polybar/scripts/calendar.sh &

[module/time]
type = custom/script
exec = date '+%H:%M'
interval = 1
format = <label>
label = %output%
label-foreground = #00FFFF
click-left = ~/.config/polybar/scripts/calendar.sh &

[module/storage]
type = custom/script
exec = ~/.config/polybar/scripts/storage.sh
interval = 10
format = <label>
label = %output%
label-foreground = #ff1744

[module/apps]
type = custom/script
exec = ~/.config/polybar/scripts/i3-apps.sh
interval = 2
format = <label>
label = %output%
label-foreground = #ff7144

[module/sep]
type = custom/text
format = //
format-foreground = #880808
format-padding = 1

[module/network]
type = custom/script
exec = ~/.config/polybar/scripts/network.sh
interval = 1
format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/wifi-menu.sh &

[module/bluetooth]
type = custom/script
exec = ~/.config/polybar/scripts/bluetooth.sh
interval = 3
format = <label>
label = %output%
click-left = ~/.config/polybar/scripts/bluetooth-menu.sh &

[module/updates]
type = custom/script
exec = ~/.config/polybar/scripts/updates.sh
interval = 300
format = <label>
label = %output%
label-foreground = #ff1744
click-left = x-terminal-emulator -e sh -c 'sudo apt update; echo; read -p "Press Enter to close..."

[module/battery]
type = internal/battery

battery = BAT1
adapter = ACAD

poll-interval = 5
full-at = 98

format-charging = <animation-charging> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
format-full = <ramp-capacity> <label-full>

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = FULL

ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
animation-charging-framerate = 750

; vim:ft=dosini
