backend = "glx";

vsync = true;

# Shadows
shadow = false;
shadow-radius = 8;
shadow-offset-x = 0;
shadow-offset-y = 3;
shadow-opacity = 0.25;

# Fading
fading = true;
fade-in-step = 0.05;
fade-out-step = 0.05;

# Transparency
inactive-opacity = 0.96;
active-opacity = 1.0;
frame-opacity = 0.95;

# Rounded corners
corner-radius = 0;

# Don't apply transparency to these
opacity-rule = [
    "100:class_g = 'Rofi'",
    "100:class_g = 'i3bar'"
];
