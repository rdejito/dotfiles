# Switch the default sink/source to newly connected devices (e.g. Bluetooth
# headphones), the way PulseAudio's module-switch-on-connect does.
#
# PipeWire merges this drop-in with the stock pipewire-pulse.conf, so the
# modules already loaded there (module-always-sink) are kept.
#
# The module ignores internal PCI/ISA devices (so it will not fight the
# built-in speakers), ignores virtual sinks (e.g. EasyEffects) and blocklists
# HDMI by default. We extend the blocklist with "bluez_input" so Bluetooth
# microphones are ignored: the headset mic only exists in HSP/HFP mode, and
# selecting it as the default source would force the card out of the
# high-quality A2DP profile. Only the (A2DP) output is switched.
pulse.cmd = [
    { cmd = "load-module" args = "module-switch-on-connect blocklist=hdmi|bluez_input" }
]
